# Direct career site registry for ApplyPilot
# Users can add their own sites following this pattern.
# Use {location_encoded} placeholder for location (URL-encoded).
# Use {query_encoded} placeholder for search terms (URL-encoded).
# Use {distance} / {distance_encoded} for searches.yaml defaults.distance (miles).

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs. Jobs routing through them
# are flagged as "manual" during apply — bot skips, user applies by hand.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time
  - "myworkdayjobs.com"        # Workday — requires account login, can't automate

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"
    - "%workopolis.com/out%"

# ── No-signup domains — agent must NEVER create accounts on these ─────────
# Major job boards and ATS platforms where account creation is risky/pointless.
# The agent will output RESULT:FAILED:login_required instead of signing up.
no_signup_domains:
  - "linkedin.com"
  - "indeed.com"
  - "glassdoor.com"
  - "monster.com"
  - "ziprecruiter.com"
  - "dice.com"
  - "lever.co"
  - "greenhouse.io"
  - "myworkdayjobs.com"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used by detail enrichment to resolve relative URLs scraped from sites.
# Sites not listed here (or with null) cannot have relative URLs resolved.
base_urls:
  "BuiltIn Remote": "https://builtin.com"
  "Hacker News Jobs": "https://news.ycombinator.com/"
  "RemoteOK": null
  "WelcomeToTheJungle": null
  "Workopolis": "https://www.workopolis.com"
  "WeWorkRemotely": "https://weworkremotely.com"
  "Startup.jobs": "https://startup.jobs"
  "Nodesk": "https://nodesk.co"
  "JustRemote": "https://justremote.co"
  "Arc.dev": "https://arc.dev"
  "Himalayas": "https://himalayas.app"
  "Techstars Jobs": "https://www.techstars.com"
  "SimplyHired": "https://www.simplyhired.com"
  "Dice": "https://www.dice.com"
  "PowerToFly": "https://powertofly.com"
  "Wellfound": "https://wellfound.com"
  "Jobgether": "https://jobgether.com"
  "TopStartups": "https://topstartups.io"
  "Jobspresso": "https://jobspresso.co"
  "FlexJobs": "https://www.flexjobs.com"
  "Remotive": "https://remotive.com"
  "Working Nomads": "https://www.workingnomads.com"
  "Remote.co": "https://remote.co"
  "DynamiteJobs": "https://dynamitejobs.com"
  "4DayWeek": "https://4dayweek.io"

sites:
  # ── Searchable sites (URL includes query + location params) ──────────
  # Canada-specific
  # NOTE: removed: Eluta, Talent.com, Randstad Canada, CareerJet Canada, Job Bank Canada

  # remaining search sites
  - name: "Dice"
    url: "https://www.dice.com/jobs?q={query_encoded}&location={location_encoded}{remote_param}"
    type: search
    no_headful: true  # dice.com is a SPA that requires login; headful retry is pointless
    remote_param:
      when_remote: "&filters.workplaceTypes=Remote"
      when_not_remote: ""

  - name: "SimplyHired"
    url: "https://www.simplyhired.com/search?q={query_encoded}&l={location_encoded}"
    type: search

  - name: "PowerToFly"
    url: "https://powertofly.com/jobs/?keywords={query_encoded}{remote_param}"
    type: search
    remote_param:
      when_remote: "&remote=true"
      when_not_remote: ""

  - name: "Techstars Jobs"
    url: "https://jobs.techstars.com/jobs?keywords={query_encoded}"
    type: search

  - name: "Startup.jobs"
    url: "https://startup.jobs/?q={query_encoded}{remote_param}"
    type: search
    remote_param:
      when_remote: "&remote=true"
      when_not_remote: ""

  - name: "WelcomeToTheJungle"
    # No stable remote-only query parameter validated; keep query-only template.
    url: "https://www.welcometothejungle.com/en/jobs?query={query_encoded}"
    type: search

  # ── Static sites (no query params, scraped once) ─────────────────────
  # Remote-first boards
  - name: "RemoteOK"
    url: "https://remoteok.com/remote-dev-jobs"
    type: static

  - name: "WeWorkRemotely"
    url: "https://weworkremotely.com/categories/remote-programming-jobs"
    type: static

  - name: "Remotive"
    url: "https://remotive.com/remote-jobs/software-development"
    type: static

  - name: "JustRemote"
    url: "https://justremote.co/remote-developer-jobs"
    type: static

  - name: "Himalayas"
    url: "https://himalayas.app/jobs/developer"
    type: static

  - name: "Working Nomads"
    url: "https://www.workingnomads.com/jobs?category=development"
    type: static

  - name: "Remote.co"
    url: "https://remote.co/remote-jobs/developer/"
    type: static

  - name: "Nodesk"
    url: "https://nodesk.co/remote-jobs/"
    type: static

  - name: "DynamiteJobs"
    url: "https://dynamitejobs.com/category/remote-development-jobs"
    type: static

  - name: "4DayWeek"
    url: "https://4dayweek.io/remote-engineering-jobs"
    type: static

  # General tech (no search param)
  - name: "Hacker News Jobs"
    url: "https://news.ycombinator.com/jobs"
    type: static

  - name: "BuiltIn Remote"
    url: "https://builtin.com/jobs/remote/dev-engineering"
    type: static

  - name: "Wellfound"
    url: "https://wellfound.com/role/l/software-engineer/canada"
    type: static

  - name: "Arc.dev"
    url: "https://arc.dev/remote-jobs"
    type: static

  - name: "Jobgether"
    url: "https://jobgether.com/remote-jobs/software-engineer"
    type: static

  - name: "TopStartups"
    url: "https://topstartups.io/jobs/?job_location=Remote"
    type: static

  - name: "Jobspresso"
    url: "https://jobspresso.co/remote-work/"
    type: static

  - name: "FlexJobs"
    url: "https://www.flexjobs.com/remote-jobs/computer-it"
    type: static
